name: Build Zygisk Module

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Android NDK
      uses: nttld/setup-ndk@v1
      id: setup-ndk
      with:
        # Пробуем версию, которая точно была актуальна для этого проекта
        ndk-version: r25c 

    - name: Build with Gradle
      run: |
        chmod +x gradlew
        # Принудительно указываем Gradle использовать NDK, который мы только что скачали
        ./gradlew :module:assembleRelease -Pandroid.ndkVersion=${{ steps.setup-ndk.outputs.ndk-version }}
      env:
        ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: zygisk-module
        path: module/build/outputs/apk/release/*.apk
